name: daily-reels

on:
  # Started by a Claude cloud routine every morning (it pushes a timestamp to trigger/build.txt); the cron lines stay as a backup.
  # Later runs exit if today was already built, so several starts never build twice.
  push:
    branches: [main]
    paths: ['trigger/build.txt']
  schedule:
    - cron: '47 8 * * *'
    - cron: '47 9 * * *'
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many reels to build'
        default: '3'
      test:
        description: 'Build only samples/test_reel.json (does not touch the queue)'
        type: boolean
        default: false
      ab3d:
        description: 'Also build the daily A/B version in 3D (style toy3d)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's reels already exist
        id: guard
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FOUND=false; for t in $(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep "^reels-$(date -u +%F)"); do gh release view "$t" --json assets --jq '.assets[].name' | grep '\.mp4$' | grep -vq 'test_reel' && FOUND=true; done
          if [ "$FOUND" = true ]; then echo 'already built today'; echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install tools
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          npm ci --prefix tools
          npx --prefix tools puppeteer browsers install chrome
          sudo apt-get update -qq && sudo apt-get install -y -qq libgbm1 libnss3 libasound2t64 fonts-dejavu-core > /dev/null || true

      - name: Cache Whisper model
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: tools/node_modules/@huggingface/transformers/.cache
          key: whisper-small-timestamped-v1

      - name: Build reels
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REELS_PER_DAY: ${{ inputs.count || '3' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$REELS_PER_DAY"
          if [ "${{ inputs.test }}" != "true" ]; then BACK=$(bash scripts/backlog.sh posted/posted.txt | wc -l); N=$(( N - BACK )); [ "$N" -lt 0 ] && N=0; echo "unposted from earlier days: $BACK -> building $N"; fi
          node scripts/daily.js --count "$N" ${{ inputs.test && '--test' || '' }}

      - name: Commit queue progress
        if: ${{ always() && !inputs.test && steps.guard.outputs.skip != 'true' }}   # also after a partial failure, so built reels leave the queue
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A queue done qa
          git diff --cached --quiet || (git commit -m "Built reels $(date -u +%F)" && git pull --rebase -q && git push)

      - name: Publish release with the videos
        id: release
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(date -u +%F)
          DIR="out/$DAY"
          ls "$DIR"/*.mp4 >/dev/null 2>&1 || { echo "no videos to publish"; cat "$DIR/SUMMARY.md" 2>/dev/null; exit 0; }
          [ -f "$DIR/SUMMARY.md" ] || echo "# Reels $DAY" > "$DIR/SUMMARY.md"
          TAG="${{ inputs.test && 'test' || 'reels' }}-$DAY-${{ github.run_number }}"   # test runs never get the reels- prefix, so they are never posted
          gh release create "$TAG" "$DIR"/*.mp4 "$DIR"/*.txt --title "${{ inputs.test && 'TEST ' || '' }}Reels $DAY" --notes-file "$DIR/SUMMARY.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "day=$DAY" >> "$GITHUB_OUTPUT"

      # A/B test: one of today's scripts again in the 3D style (same text and voice). Built after the 2D release so the first post slot is never late.
      - name: Build the 3D A/B version and add it to today's release
        if: ${{ always() && steps.release.outputs.tag != '' && inputs.ab3d != false }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.release.outputs.day }}"; TAG="${{ steps.release.outputs.tag }}"
          [ -f "out/$DAY/ab3d.json" ] || { echo 'no A/B script today'; exit 0; }
          node scripts/ab3d.js --day "$DAY" || { echo '3D build failed, the 2D reels are not affected'; exit 0; }
          OUT="$(cat "out/$DAY/ab3d.out")"
          gh release upload "$TAG" "out/$DAY/$OUT.mp4" "out/$DAY/$OUT.txt"
          gh release edit "$TAG" --notes-file "out/$DAY/SUMMARY.md" || true
          if [ "${{ inputs.test }}" != "true" ]; then git config user.name 'reels-bot'; git config user.email 'reels-bot@users.noreply.github.com'; git add -A qa; git diff --cached --quiet || (git commit -m "A/B 3D reel $DAY" && git pull --rebase -q && git push); fi
